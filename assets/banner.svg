<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-labelledby="title desc">
  <title id="title">M. Priyadharshan, Full Stack Software Engineer</title>
  <desc id="desc">A dark banner with a terminal typing whoami and the stack on the left, and the name and role on the right.</desc>
  <style>
    .mono { font-family: 'Cascadia Code', Consolas, Menlo, 'DejaVu Sans Mono', monospace; }
    .sans { font-family: 'Segoe UI', 'Helvetica Neue', Arial, sans-serif; }
    /* Each line is revealed one character at a time: steps(n) with n = the line's character count. */
    .type { clip-path: inset(-4px 100% -4px -2px); animation-name: type; animation-fill-mode: both; }
    .l1 { animation-duration: .48s; animation-timing-function: steps(8, end);  animation-delay: .5s; }
    .l2 { animation-duration: .9s;  animation-timing-function: steps(36, end); animation-delay: 1.3s; }
    .l3 { animation-duration: .9s;  animation-timing-function: steps(15, end); animation-delay: 2.55s; }
    .l4 { animation-duration: 1.2s; animation-timing-function: steps(48, end); animation-delay: 3.8s; }
    .l5 { animation-duration: .96s; animation-timing-function: steps(16, end); animation-delay: 5.35s; }
    .l6 { animation-duration: .96s; animation-timing-function: steps(32, end); animation-delay: 6.65s; }
    .cursor { opacity: 0; animation: blink 1s steps(1) 7.6s infinite; }
    @keyframes type { from { clip-path: inset(-4px 100% -4px -2px); } to { clip-path: inset(-4px -2px -4px -2px); } }
    .glow { animation: pulse 6s ease-in-out infinite; }
    .rise { opacity: 0; animation: rise .8s ease-out forwards; }
    .r1 { animation-delay: .2s; } .r2 { animation-delay: .5s; } .r3 { animation-delay: .8s; } .r4 { animation-delay: 1.1s; }
    @keyframes show { to { opacity: 1; } }
    @keyframes blink { 0% { opacity: 1; } 50% { opacity: 0; } }
    @keyframes pulse { 0%, 100% { opacity: .55; } 50% { opacity: .9; } }
    @keyframes rise { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
  </style>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1020"/><stop offset=".55" stop-color="#0d1530"/><stop offset="1" stop-color="#101a2e"/>
    </linearGradient>
    <radialGradient id="g1" cx="0.85" cy="0.1" r="0.6"><stop offset="0" stop-color="#7c3aed" stop-opacity=".45"/><stop offset="1" stop-color="#7c3aed" stop-opacity="0"/></radialGradient>
    <radialGradient id="g2" cx="0.1" cy="1" r="0.6"><stop offset="0" stop-color="#06b6d4" stop-opacity=".35"/><stop offset="1" stop-color="#06b6d4" stop-opacity="0"/></radialGradient>
    <linearGradient id="name" x1="0" x2="1"><stop offset="0" stop-color="#67e8f9"/><stop offset=".5" stop-color="#a5b4fc"/><stop offset="1" stop-color="#f0abfc"/></linearGradient>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse"><path d="M28 0H0V28" fill="none" stroke="#1e293b" stroke-width="1"/></pattern>
  </defs>

  <rect width="1200" height="300" rx="14" fill="url(#bg)"/>
  <rect width="1200" height="300" rx="14" fill="url(#grid)" opacity=".55"/>
  <rect class="glow" width="1200" height="300" rx="14" fill="url(#g1)"/>
  <rect class="glow" width="1200" height="300" rx="14" fill="url(#g2)"/>

  <!-- terminal -->
  <g transform="translate(40 34)">
    <rect width="520" height="232" rx="12" fill="#0a0f1d" stroke="#334155" stroke-width="1.2"/>
    <rect width="520" height="34" rx="12" fill="#111a2e"/>
    <rect y="22" width="520" height="12" fill="#111a2e"/>
    <circle cx="20" cy="17" r="5.5" fill="#f87171"/><circle cx="38" cy="17" r="5.5" fill="#fbbf24"/><circle cx="56" cy="17" r="5.5" fill="#4ade80"/>
    <text x="260" y="22" text-anchor="middle" class="mono" font-size="12.5" fill="#64748b">priyadharshan@dev: ~</text>

    <g class="mono" font-size="16">
      <text x="20" y="66" class="type l1"><tspan fill="#4ade80">$</tspan><tspan fill="#e2e8f0"> whoami</tspan></text>
      <text x="20" y="92" class="type l2" fill="#94a3b8">full stack software engineer · india</text>
      <text x="20" y="124" class="type l3"><tspan fill="#4ade80">$</tspan><tspan fill="#e2e8f0"> cat stack.txt</tspan></text>
      <text x="20" y="150" class="type l4" fill="#67e8f9">python · fastapi · react · typescript · postgres</text>
      <text x="20" y="182" class="type l5"><tspan fill="#4ade80">$</tspan><tspan fill="#e2e8f0"> pytest &amp;&amp; ship</tspan></text>
      <text x="20" y="208" class="type l6" xml:space="preserve"><tspan fill="#4ade80">✓ all tests passed</tspan><tspan fill="#94a3b8">  →  shipped</tspan><tspan fill="#e2e8f0"> </tspan><tspan class="cursor" fill="#e2e8f0">▌</tspan></text>
    </g>
  </g>

  <!-- name and role -->
  <g class="sans">
    <text x="610" y="86" class="rise r1" font-size="15" letter-spacing="4" fill="#94a3b8">HI, I'M</text>
    <text x="608" y="148" class="rise r2" font-size="58" font-weight="800" fill="url(#name)">M. Priyadharshan</text>
    <text x="610" y="190" class="rise r3" font-size="22" font-weight="600" letter-spacing="1.5" fill="#e2e8f0">FULL STACK SOFTWARE ENGINEER</text>
    <text x="610" y="228" class="rise r4" font-size="17" font-style="italic" fill="#94a3b8">Curious about how things break, careful about how they're built.</text>
  </g>
</svg>
